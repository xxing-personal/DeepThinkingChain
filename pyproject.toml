[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepthinkingchain"
version = "0.1.0"
description = "A multi-agent system for deep analytical thinking chains"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "DeepThinking Contributors"}
]
dependencies = [
    "openai>=1.3.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.6",
    "tqdm>=4.66.1",
    "beautifulsoup4>=4.12.3",
    "html2text>=2020.1.16",
    "litellm>=1.30.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
]

[tool.setuptools]
packages = ["deepthinkingchain"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88 